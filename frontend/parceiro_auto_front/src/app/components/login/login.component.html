<main class="login-page">
  <section class="login-card" aria-label="Formulário de login">
    <h1>Entrar</h1>
    <p class="subtitle">
      Use o e-mail corporativo e a senha cadastrada para acessar o painel.
    </p>

    <div class="field-group">
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="nome@empresa.com" />
    </div>

    <div class="field-group">
      <label for="password">Senha</label>
      <input id="password" type="password" placeholder="Sua senha" />
    </div>

    <button type="submit" class="login-btn">Entrar</button>

    <button type="button" class="register-btn" routerLink="/register">
      Cadastrar
    </button>

    <p class="help-text">
      Precisa do acesso inicial? Solicite um convite ao administrador da sua empresa.
    </p>
  </section>
</main>
